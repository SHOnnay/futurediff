name: Production closure controls
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  closure-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile closure toolkit
        run: python -m py_compile tools/futurediff_closure.py
      - name: Run closure tests
        run: python -m unittest -v tests/test_closure.py
  external-production-completion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, futurediff-production-certification]
    environment: production-certification
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Execute with real evidence
        run: ./scripts/production-closure.sh "$CANONICAL_REPOSITORY" "$BASE_ARCHIVE" "$ARCHIVE_DIRECTORY" dist/closure
