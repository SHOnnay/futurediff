name: release-candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v1.40.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build verified release candidate
        run: ./scripts/release-candidate.sh "${{ steps.version.outputs.value }}" "$PWD/dist"
      - name: Build operational evidence
        run: ./scripts/operations-assurance.sh dist/operations
      - name: Attest source archive
        uses: actions/attest@v4
        with:
          subject-path: dist/*.zip
      - name: Upload candidate evidence
        uses: actions/upload-artifact@v7
        with:
          name: futurediff-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
