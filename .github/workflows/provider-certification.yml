name: provider-certification

on:
  workflow_dispatch:
    inputs:
      github_owner:
        description: GitHub owner or organization for the controlled test repository.
        required: true
        type: string
      github_repo:
        description: GitHub repository for the controlled test repository.
        required: true
        type: string
      github_base:
        description: GitHub base branch to freshness-check.
        required: true
        type: string
      github_expected_sha:
        description: Stale expected base SHA used to verify the block.
        required: true
        type: string
      slack_channel:
        description: Slack channel for the provider smoke message.
        required: true
        type: string
      slack_text:
        description: Slack message text for the provider smoke message.
        required: false
        default: FutureDiff provider smoke benchmark
        type: string
      slack_thread_ts:
        description: Optional Slack thread timestamp for the provider smoke message.
        required: false
        default: ''
        type: string
      github_base_url:
        description: Optional GitHub API base URL override for GitHub Enterprise.
        required: false
        default: https://api.github.com
        type: string
      slack_base_url:
        description: Optional Slack API base URL override.
        required: false
        default: https://slack.com/api
        type: string

jobs:
  provider-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUTUREDIFF_GITHUB_TOKEN: ${{ secrets.FUTUREDIFF_GITHUB_TOKEN }}
      FUTUREDIFF_SLACK_TOKEN: ${{ secrets.FUTUREDIFF_SLACK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build commands
        run: make build

      - name: Run provider certification
        run: |
          test -n "$FUTUREDIFF_GITHUB_TOKEN"
          test -n "$FUTUREDIFF_SLACK_TOKEN"
          ./bin/futurediff-certify-providers \
            --output "$RUNNER_TEMP/provider-certification.json" \
            --futurepack "$RUNNER_TEMP/provider-certification.futurepack" \
            --root "$RUNNER_TEMP/provider-certification-artifacts" \
            --github-base-url '${{ inputs.github_base_url }}' \
            --github-owner '${{ inputs.github_owner }}' \
            --github-repo '${{ inputs.github_repo }}' \
            --github-base '${{ inputs.github_base }}' \
            --github-expected-sha '${{ inputs.github_expected_sha }}' \
            --slack-base-url '${{ inputs.slack_base_url }}' \
            --slack-channel '${{ inputs.slack_channel }}' \
            --slack-text '${{ inputs.slack_text }}' \
            --slack-thread-ts '${{ inputs.slack_thread_ts }}'
      - name: Upload provider certification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: provider-certification
          path: |
            ${{ runner.temp }}/provider-certification.json
            ${{ runner.temp }}/provider-certification.futurepack
            ${{ runner.temp }}/provider-certification-artifacts/
          if-no-files-found: error
