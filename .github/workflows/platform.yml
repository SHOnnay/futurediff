name: platform
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Native tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build all commands
        run: go build ./cmd/...
      - name: Platform report
        run: go run ./cmd/futurediff-platform --output platform-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.os }}
          path: platform-report.json
  windows-decision:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce explicit unsupported decision
        shell: pwsh
        run: |
          $text = Get-Content internal/platformsupport/platform.go -Raw
          if ($text -notmatch 'GOOS:"windows".*Level:Unsupported') { throw 'Windows support decision missing' }
