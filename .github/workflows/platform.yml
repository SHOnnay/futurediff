name: platform
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install SQLite development library
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == ubuntu-* ]]; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-dev pkg-config
          else
            brew install sqlite
            echo "PKG_CONFIG_PATH=$(brew --prefix sqlite)/lib/pkgconfig" >> "$GITHUB_ENV"
            echo "CGO_CFLAGS=-I$(brew --prefix sqlite)/include" >> "$GITHUB_ENV"
            echo "CGO_LDFLAGS=-L$(brew --prefix sqlite)/lib" >> "$GITHUB_ENV"
          fi
      - name: Native tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build all commands
        run: go build ./cmd/...
      - name: Platform report
        run: go run ./cmd/futurediff-platform --output platform-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.os }}
          path: platform-report.json
  windows-decision:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce explicit unsupported decision
        shell: pwsh
        run: |
          $text = Get-Content internal/platformsupport/platform.go -Raw
          if ($text -notmatch 'GOOS:\s*"windows"[\s\S]*Level:\s*Unsupported') { throw 'Windows support decision missing' }
